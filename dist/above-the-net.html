<style>
/* ============================================================ ABOVE THE NET
   Mobile-first, dark, thumb-friendly. No framework.
   ======================================================================== */

:root {
  --bg: #0b0d10;
  --bg-2: #12161b;
  --card: #161b22;
  --card-2: #1c222b;
  --line: rgba(255, 255, 255, .085);
  --line-2: rgba(255, 255, 255, .14);
  --fg: #eef2f7;
  --fg-2: #a4b0c0;
  --fg-3: #6c7889;
  --accent: #4f8ff7;
  --good: #30a46c;
  --warn: #f7a84f;
  --bad: #e5484d;
  --r: 16px;
  --r-sm: 10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --tab-h: 62px;
  --fnt: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --num-fnt: ui-monospace, 'SF Mono', 'Menlo', monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--fnt);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
}

#app { display: flex; flex-direction: column; min-height: 100dvh; }

.main {
  flex: 1;
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 12px);
  max-width: 620px;
  margin: 0 auto;
  width: 100%;
}

h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }

.spacer { height: 28px; }
.pad { padding: 20px; }
.muted { color: var(--fg-2); font-size: 13.5px; line-height: 1.5; }
.small { font-size: 12px; }

/* ------------------------------------------------------------------ HEADER */
.hdr {
  padding: calc(var(--safe-t) + 18px) 18px 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--bg)) 0%, var(--bg) 100%);
}

.hdr-top { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
.hdr-kicker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.hdr-title { font-size: 26px; line-height: 1.15; letter-spacing: -.025em; }
.hdr-sub { color: var(--fg-2); font-size: 13px; margin-top: 5px; }
.hdr-ring { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; color: var(--accent); }
.hdr-ring-cap { font-size: 10px; color: var(--fg-3); letter-spacing: .02em; }

/* ----------------------------------------------------------------- CHIPS */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  background: rgba(255, 255, 255, .07); color: var(--fg-2);
  border: 1px solid var(--line); white-space: nowrap;
}
.chip--block { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--fg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.chip--warn { background: rgba(247, 168, 79, .16); color: #f7c98f; border-color: rgba(247, 168, 79, .38); }
.chip--good { background: rgba(48, 164, 108, .16); color: #6ddda2; border-color: rgba(48, 164, 108, .38); }
.chip--bad { background: rgba(229, 72, 77, .16); color: #ff9a9d; border-color: rgba(229, 72, 77, .38); }
.chip--now { background: color-mix(in srgb, var(--accent) 30%, transparent); color: #fff; border-color: transparent; }
.chip--solid { background: var(--accent); color: #04070c; border-color: transparent; }

/* -------------------------------------------------------------- DAY STRIP */
.daystrip { display: flex; align-items: center; gap: 6px; padding: 14px 0 12px; }
.daystrip-nav {
  background: none; border: 1px solid var(--line); border-radius: 8px;
  width: 28px; height: 32px; color: var(--fg-2); font-size: 18px; line-height: 1;
  flex-shrink: 0;
}
.daystrip-nav:disabled { opacity: .3; }
.daystrip-days { display: flex; gap: 5px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.daystrip-days::-webkit-scrollbar { display: none; }

.dpill {
  flex: 1; min-width: 42px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 8px 4px 7px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 11px; color: var(--fg-2);
}
.dpill-day { font-size: 11px; font-weight: 700; letter-spacing: .03em; }
.dpill-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.dpill.is-done .dpill-dot { background: var(--good); box-shadow: 0 0 7px rgba(48, 164, 108, .7); }
.dpill.is-active {
  background: color-mix(in srgb, var(--accent) 20%, var(--card));
  border-color: var(--accent); color: var(--fg);
}
.dpill.is-opt { opacity: .55; }

/* ------------------------------------------------------------------ CARDS */
.stack { display: flex; flex-direction: column; gap: 14px; padding: 14px 14px 0; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.card--brief { gap: 8px; background: var(--bg-2); }
.focus { font-size: 14.5px; font-weight: 700; color: var(--fg); line-height: 1.35; }
.brief { font-size: 13.5px; color: var(--fg-2); line-height: 1.55; }

.card--hero {
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, var(--card)), var(--card) 70%);
  border-color: color-mix(in srgb, var(--accent) 30%, transparent);
}
.hero-cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-2); }
.hero-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.hero-num { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-family: var(--num-fnt); }
.hero-unit { font-size: 17px; color: var(--fg-2); font-weight: 600; }
.hero-delta { margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.hero-delta.up { background: rgba(48, 164, 108, .17); color: #6ddda2; }
.hero-delta.down { background: rgba(229, 72, 77, .17); color: #ff9a9d; }

.note-inline { font-size: 12.5px; color: var(--fg-2); line-height: 1.55; padding-top: 2px; }

/* --------------------------------------------------------------- BANNERS */
.banner {
  display: flex; align-items: center; gap: 10px; justify-content: space-between;
  padding: 12px 14px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600;
  border: 1px solid;
}
.banner--good { background: rgba(48, 164, 108, .12); border-color: rgba(48, 164, 108, .3); color: #8fe6b6; }

/* -------------------------------------------------------------- SECTIONS */
.sect { display: flex; flex-direction: column; gap: 9px; }
.sect--prep { opacity: .92; }
.sect-head { padding: 4px 2px 0; }
.sect-title { font-size: 12.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.sect--prep .sect-title { color: var(--fg-3); }
.sect-note { font-size: 12.5px; color: var(--fg-2); margin-top: 4px; line-height: 1.5; }

/* ------------------------------------------------------------ EX. CARDS */
.xcard {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden;
}
.xcard.is-dim { opacity: .42; }
.sect--prep .xcard { background: var(--bg-2); }

.xcard-head {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 14px 11px; cursor: pointer;
}
.xcard-title-wrap { flex: 1; min-width: 0; }
.xcard-title { font-size: 16px; letter-spacing: -.015em; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.xcard-meta { font-size: 12.5px; color: var(--fg-2); margin-top: 4px; font-family: var(--num-fnt); }
.pairtag {
  font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  background: color-mix(in srgb, var(--accent) 26%, transparent); color: var(--fg);
  padding: 2px 6px; border-radius: 5px;
}
.info-btn {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255, 255, 255, .07); border: 1px solid var(--line);
  color: var(--fg-2); font-size: 13px; font-weight: 800;
}
.xcard-note {
  font-size: 12.5px; color: #f7c98f; line-height: 1.5;
  padding: 0 14px 11px; margin-top: -3px;
}

/* ------------------------------------------------------------- LOAD BAR */
.loadbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: 0 14px 12px; padding: 10px 12px;
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  border-radius: var(--r-sm);
}
.loadbar--sug { background: rgba(255, 255, 255, .04); border-color: var(--line); }
.loadbar-main { display: flex; align-items: baseline; gap: 4px; }
.loadbar-num { font-size: 26px; font-weight: 800; font-family: var(--num-fnt); letter-spacing: -.02em; color: var(--fg); }
.loadbar-unit { font-size: 12px; color: var(--fg-2); font-weight: 600; }
.loadbar-hint { font-size: 11.5px; color: var(--fg-3); }
.loadbar-ramp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-left: auto; }
.ramp-cap { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 700; }
.ramp-step {
  font-size: 11px; font-family: var(--num-fnt); color: var(--fg-2);
  background: rgba(255, 255, 255, .06); padding: 3px 6px; border-radius: 5px;
}

/* ---------------------------------------------------------------- SETS */
.sets { border-top: 1px solid var(--line); }
.setrow {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; border-bottom: 1px solid var(--line);
}
.setrow:last-child { border-bottom: none; }
.setrow.is-done { background: rgba(48, 164, 108, .07); }

.setno {
  width: 21px; height: 21px; flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 6px; background: rgba(255, 255, 255, .07);
  font-size: 11px; font-weight: 800; color: var(--fg-2);
  font-family: var(--num-fnt);
}
.setrow.is-done .setno { background: var(--good); color: #04140b; }

.setfield { display: flex; align-items: baseline; gap: 3px; flex: 1; min-width: 0; }
.setfield--rpe { flex: 0 0 52px; }
.setfield--wide { flex: 1; }
.setstatic { font-size: 13.5px; color: var(--fg-2); font-family: var(--num-fnt); }
.setunit { font-size: 10.5px; color: var(--fg-3); flex-shrink: 0; }

.num {
  width: 100%; min-width: 0;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 9px;
  color: var(--fg);
  font-size: 15px; font-family: var(--num-fnt); font-weight: 700;
  text-align: center;
  -moz-appearance: textfield;
}
.num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num:focus { outline: none; border-color: var(--accent); background: rgba(255, 255, 255, .09); }
.num::placeholder { color: var(--fg-3); font-weight: 500; }
.num--rpe { font-size: 13px; padding: 8px 4px; }
.num--wide { text-align: left; padding-left: 12px; }
.num--date { font-size: 13px; text-align: left; font-family: var(--fnt); }

.checkbtn {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 11px;
  background: rgba(255, 255, 255, .05); border: 1.5px solid var(--line-2);
  display: grid; place-items: center; transition: all .16s ease;
}
.checkmark { font-size: 17px; color: var(--fg-3); line-height: 1; }
.setrow.is-done .checkbtn { background: var(--good); border-color: var(--good); }
.setrow.is-done .checkmark { color: #04140b; }
.checkbtn:active { transform: scale(.9); }

/* ------------------------------------------------------------- CAPTURE */
.capture {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 14px 12px; padding: 11px 12px;
  background: rgba(255, 255, 255, .04); border: 1px dashed var(--line-2);
  border-radius: var(--r-sm);
}
.capture-label { font-size: 12px; font-weight: 700; color: var(--fg-2); flex: 1 0 100%; }
.capture .num { flex: 1; }

/* ------------------------------------------------------------- BUTTONS */
.btn {
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, .06);
  color: var(--fg); border-radius: 11px; padding: 12px 16px;
  font-size: 14.5px; font-weight: 700; letter-spacing: -.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .35; }
.btn--primary { background: var(--accent); border-color: transparent; color: #04070c; }
.btn--danger { background: rgba(229, 72, 77, .14); border-color: rgba(229, 72, 77, .4); color: #ff9a9d; }
.btn--ghost { background: none; }
.btn--big { padding: 15px; font-size: 15.5px; }
.btn--sm { padding: 8px 12px; font-size: 13px; border-radius: 9px; }
.btn--xs { padding: 5px 9px; font-size: 11.5px; border-radius: 7px; }
.btnrow { display: flex; gap: 8px; }
.btnrow .btn { flex: 1; }

.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(255, 255, 255, .08); color: var(--fg-2); font-size: 20px; line-height: 1;
}
.linkbtn {
  background: none; border: none; color: var(--accent);
  font-size: 12.5px; font-weight: 700; padding: 4px 2px; text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
}

.rowbtn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 12px 13px; text-align: left;
}
.rowbtn-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rowbtn-chev { color: var(--fg-3); font-size: 18px; }

/* -------------------------------------------------------------- TAB BAR */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex; justify-content: space-around; align-items: stretch;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--bg) 96%, transparent);
  backdrop-filter: saturate(160%) blur(22px);
  -webkit-backdrop-filter: saturate(160%) blur(22px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1; background: none; border: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--fg-3); padding: 6px 2px;
}
.tab-icon { width: 22px; height: 22px; }
.tab-label { font-size: 10px; font-weight: 700; letter-spacing: .01em; }
.tab.is-active { color: var(--accent); }
.tab:active { opacity: .6; }

/* ----------------------------------------------------------- REST TIMER */
.rest-bar {
  position: fixed; left: 12px; right: 12px;
  bottom: calc(var(--tab-h) + var(--safe-b) + 12px);
  z-index: 45; color: var(--accent);
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 14px;
  background: color-mix(in srgb, var(--card-2) 96%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  box-shadow: 0 12px 34px rgba(0, 0, 0, .55);
  transform: translateY(140%); opacity: 0;
  transition: transform .3s cubic-bezier(.22, 1, .36, 1), opacity .25s ease;
  max-width: 596px; margin: 0 auto;
}
.rest-bar.in { transform: translateY(0); opacity: 1; }
.rest-bar--low { border-color: var(--warn); color: var(--warn); }
.rest-bar--done { border-color: var(--good); color: var(--good); }
.rest-ring { width: 38px; height: 38px; flex-shrink: 0; }
.rest-meta { flex: 1; }
.rest-time { font-size: 19px; font-weight: 800; font-family: var(--num-fnt); color: var(--fg); line-height: 1.1; }
.rest-sub { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); font-weight: 700; }
.rest-btns { display: flex; gap: 5px; }
.rest-btns .chip { padding: 7px 10px; font-size: 11.5px; }

/* --------------------------------------------------------------- SHEET */
.sheet-back {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, .6);
  backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity .26s ease;

/**
 * Resolve one template item against a block's scheme.
 * Percentage loading is only applied when the movement actually references a
 * tested max; everything else falls back to autoregulated RPE.

function resolve(item, scheme) {
  const role = item.role;
  if (!role) return { ...item };
  const r = scheme[role];
  if (!r) throw new Error(`Unknown role "${role}" for ${item.ex}`);

  const out = { ex: item.ex, sets: r.sets, reps: r.reps, rest: r.rest };
  const usesPct = r.pct && !!ex(item.ex).ref;
  if (usesPct) out.pct = r.pct;
  else if (r.rpe) out.rpe = r.rpe;

  // Template overrides always win.
  for (const [k, v] of Object.entries(item)) {
    if (k === 'role' || k === 'ex') continue;
    out[k] = v;
  }
  if (out.pct && out.rpe) delete out.rpe;
  return out;
}

function buildSession(tpl, scheme) {
  return {
    ...tpl,
    sections: tpl.sections.map(sec => ({
      name: sec.name,
      notes: sec.notes,
      items: sec.items.map(it => resolve(it, scheme))
    }))
  };
}

/* ============================================================== THE BLOCKS */
const BLOCK_DEFS = [
  { n: 1, name: 'Base',        weeks: [1, 2, 3, 4],     color: '#4f8ff7', phase: P1, tagline: 'Learn the patterns',

    detail: 'Volume drops and intensity peaks so the new muscle gets expressed as strength rather than just size. Week 23 tapers and week 24 re-runs the entire battery — tape, scale, jumps and 3RMs — against your week-zero numbers. Then you decide: keep gaining, or run a short cut to sharpen up at your new weight.' }

const BLOCKS = BLOCK_DEFS.map(b => ({
  n: b.n, name: b.name, weeks: b.weeks, color: b.color,
  tagline: b.tagline, goal: b.goal, detail: b.detail,
  scheme: SCHEMES[b.n].label,
  days: b.phase.map(tpl => buildSession(tpl, SCHEMES[b.n]))
}));

const TOTAL_WEEKS = 24;

/** The three 8-week phases, for the plan overview. */
const PHASES = [
  { name: 'Build the base', weeks: '1-8',   blocks: [1, 2], detail: 'Master the patterns, then bury yourself in volume.' },
  { name: 'Add the load',   weeks: '9-16',  blocks: [3, 4], detail: 'Get stronger, then grow into the new strength.' },
  { name: 'Fill the frame', weeks: '17-24', blocks: [5, 6], detail: 'Maximum effort, then consolidate and retest.' }
];

/* ----------------------------------------------------------------- LOOKUPS */
function blockForWeek(week) {
  return BLOCKS.find(b => b.weeks.includes(week)) || BLOCKS[0];
}

function weekInBlock(week) {
  const b = blockForWeek(week);
  return b.weeks.indexOf(week); // 0..3, where 3 is the deload week
}

function isDeloadWeek(week) {
  return weekInBlock(week) === 3;
}

function isTestWeek(week) {
  return week === TOTAL_WEEKS;
}

/** All sessions for a given week, in day order. */
function weekSessions(week) {
  if (isTestWeek(week)) {
    const light = BLOCKS[5].days.find(d => d.day === 4);
    return [
      TEST_DAY_A,
      { ...light, day: 1, name: 'Pull — light', brief: 'Light maintenance between test days. Two sets per movement, nothing near failure.' },
      { ...RECOVERY_DAY, day: 2, name: 'Recovery (pre-test)' },
      TEST_DAY_B,
      { ...BLOCKS[5].days.find(d => d.day === 2), day: 4, name: 'Free Play', brief: 'Go play volleyball at your new bodyweight. This is the whole point.', optional: true },
      RECOVERY_DAY
    ].sort((a, b) => a.day - b.day);
  }
  const b = blockForWeek(week);
  return [...b.days, RECOVERY_DAY].sort((x, y) => x.day - y.day);
}

function sessionFor(week, dayIndex) {
  return weekSessions(week).find(s => s.day === dayIndex) || null;
}

function dayLabel(dayIndex) {
  return DAY_LABELS[dayIndex];
}

/** Resolve a per-week-indexed prescription value. */
function atWeek(value, wib) {
  if (Array.isArray(value)) return value[Math.min(wib, value.length - 1)];
  return value;
}

const SUPPORT_RE = /prep|recovery|down-regulate|flow|tissue|aerobic|durability|spring/i;
/* Armor work is real work, but counting it as "pull volume" would flatter the
   numbers, so the per-pattern view leaves it out. */
const NON_HYPERTROPHY_RE = /prep|recovery|down-regulate|flow|tissue|aerobic|durability|spring|armor/i;

/** Total planned working sets in a session (excludes prep/recovery). */
function sessionVolume(session, wib) {
  let sets = 0;
  for (const sec of session.sections) {
    if (SUPPORT_RE.test(sec.name)) continue;
    for (const it of sec.items) sets += atWeek(it.sets, wib) || 0;
  }
  return sets;
}

/** Rough session duration estimate in minutes. */
function sessionMinutes(session, wib) {
  let mins = 0;
  for (const sec of session.sections) {
    for (const it of sec.items) {
      const sets = atWeek(it.sets, wib) || 1;
      const rest = it.rest || 30;
      mins += (sets * (rest + 35)) / 60;
    }
  }
  return Math.round(mins / 5) * 5;
}

/**
 * Weekly set count per movement pattern — the number that actually drives
 * hypertrophy, and worth being able to see.
 */
function weeklySetsByPattern(week) {
  const wib = weekInBlock(week);
  const out = {};
  for (const s of weekSessions(week)) {
    if (s.optional) continue;
    for (const sec of s.sections) {
      if (NON_HYPERTROPHY_RE.test(sec.name)) continue;
      for (const it of sec.items) {
        const p = ex(it.ex).pattern || 'other';
        out[p] = (out[p] || 0) + (atWeek(it.sets, wib) || 0);
      }
    }
  }
  return out;
}

return { blockForWeek, weekInBlock, isDeloadWeek, isTestWeek, weekSessions, sessionFor, dayLabel, atWeek, sessionVolume, sessionMinutes, weeklySetsByPattern, MAX_LIFTS, METRICS, RECOVERY_DAY, TEST_DAY_A, TEST_DAY_B, BLOCKS, TOTAL_WEEKS, PHASES };
});

/**
 * Fueling model for a lean gaining phase.
 *
 * The strategy: a surplus big enough to build muscle and small enough that you
 * do not spend the back half of the year carrying fat you have to diet off.
 * Everything is derived from a target rate of gain rather than picked out of the
 * air, so changing the target changes the whole plan coherently.
 */

/** Roughly the energy cost of a pound of mixed lean-and-fat tissue gain. */
const KCAL_PER_LB = 3500;

/**
 * Training days carry a bigger surplus than rest days — you can use the food
 * better on a day you trained. REST_SHARE is the rest-day surplus expressed as
 * a fraction of the training-day surplus.
 */
const REST_SHARE = 0.35;
const TRAINING_DAYS = 5;
const REST_DAYS = 2;

const GOALS = {
  leanGain: { name: 'Lean gain',   rate: 0.45,  blurb: 'Add muscle at about half a pound a week. Slow enough to stay lean.' },
  slowGain: { name: 'Slower gain', rate: 0.30,  blurb: 'Minimal fat gain, but roughly nine months to add 10 lb.' },
  maintain: { name: 'Maintain',    rate: 0,     blurb: 'Hold your weight and keep training. Useful in season.' },
  recomp:   { name: 'Lean out',    rate: -0.50, blurb: 'A small deficit for sharpening up once you reach your target weight.' }
};

function computeTargets({
  weightLb = 190, heightIn = 75, age = 28, activity = 1.7, goal = 'leanGain'
} = {}) {
  const kg = weightLb / 2.2046;
  const cm = heightIn * 2.54;
  const bmr = Math.round(10 * kg + 6.25 * cm - 5 * age + 5);
  const tdee = Math.round(bmr * activity);

  const g = GOALS[goal] || GOALS.leanGain;
  const weeklyDelta = g.rate * KCAL_PER_LB;

  // Solve for the training-day delta given the rest-day share.
  const trainDelta = weeklyDelta / (TRAINING_DAYS + REST_DAYS * REST_SHARE);
  const restDelta = trainDelta * REST_SHARE;

  const trainKcal = Math.round((tdee + trainDelta) / 10) * 10;
  const restKcal = Math.round((tdee + restDelta) / 10) * 10;

  // Protein high enough to make the surplus build muscle rather than just mass.
  const protein = Math.round(weightLb * 1.0);
  const fat = Math.round(weightLb * 0.45);
  const proteinKcal = protein * 4;
  const fatKcal = fat * 9;

  return {
    goal, goalName: g.name, targetRate: g.rate,
    bmr, tdee,
    train: { kcal: trainKcal, protein, fat, carb: Math.round((trainKcal - proteinKcal - fatKcal) / 4) },
    rest: { kcal: restKcal, protein, fat, carb: Math.round((restKcal - proteinKcal - fatKcal) / 4) },
    weeklyAvg: Math.round((trainKcal * TRAINING_DAYS + restKcal * REST_DAYS) / 7),
    weeklyDelta: Math.round(trainKcal * TRAINING_DAYS + restKcal * REST_DAYS - tdee * 7),
    water: Math.round(weightLb * 0.6),
    fiber: Math.round((trainKcal / 1000) * 12),
    sodium: '4-6 g/day — you sweat a lot on the court and cramping kills jumps'
  };
}

function projectedWeight(startLb, weeks, ratePerWeek) {
  return +(startLb + ratePerWeek * weeks).toFixed(1);
}

/** Weeks to go from here to a goal weight at the planned rate. */
function weeksToGoal(currentLb, goalLb, ratePerWeek) {
  if (!ratePerWeek) return null;
  const w = (goalLb - currentLb) / ratePerWeek;
  return w > 0 ? Math.ceil(w) : 0;
}

/**
 * Compare measured rate of gain against the plan and say what to do about it.
 * This is the whole reason to weigh yourself — a surplus you never check is
 * just a guess.
 */
function surplusAdvice(measuredRate, targetRate) {
  if (measuredRate == null) {
    return {
      status: 'unknown', tone: 'neutral',
      headline: 'Not enough weigh-ins yet',
      detail: 'Log your bodyweight at least three times a week for two weeks and the app will tell you whether the surplus is right.'
    };
  }
  if (!targetRate) {
    return {
      status: 'ok', tone: 'good',
      headline: `Holding at ${measuredRate >= 0 ? '+' : ''}${measuredRate.toFixed(2)} lb/wk`,
      detail: 'You are maintaining. Nothing to change.'
    };
  }

  const ratio = measuredRate / targetRate;
  if (ratio < 0.4) {
    return {
      status: 'under', tone: 'warn', kcalDelta: 250,
      headline: `Gaining too slowly — ${measuredRate.toFixed(2)} lb/wk vs ${targetRate} target`,
      detail: 'Add about 250 calories to your training days, most easily as carbs around your session. Recheck in two weeks.'
    };
  }
  if (ratio > 1.8) {
    return {
      status: 'over', tone: 'warn', kcalDelta: -250,
      headline: `Gaining too fast — ${measuredRate.toFixed(2)} lb/wk vs ${targetRate} target`,
      detail: 'Past about double the target rate, the extra is mostly fat. Take roughly 250 calories back out and recheck in two weeks.'
    };
  }
  return {
    status: 'ok', tone: 'good',
    headline: `On track at ${measuredRate.toFixed(2)} lb/wk`,
    detail: 'This is exactly the rate you want. Do not change anything.'
  };
}

const RULES = [
  {
    t: 'Eat on a schedule, not on hunger',
    d: 'The hardest part of gaining is that a surplus stops feeling like one after two weeks. Four or five planned feedings beat waiting until you feel like eating — by block 3 you will not feel like it.'
  },
  {
    t: 'Protein every 3-4 hours',
    d: 'Four feedings of 45-55 g beats two of 100 g. Total matters most, but spreading it out is what turns the surplus into muscle instead of just weight.'
  },
  {
    t: 'Carbs are the cheap part of the surplus',
    d: 'They fuel the training that causes the growth, and they are far easier to eat in volume than fat or protein. Rice, oats, potatoes, pasta, fruit — this is where the extra calories should come from.'
  },
  {
    t: 'Drink some of it',
    d: 'When solid food stops going down, a shake with milk, oats, banana and peanut butter is 700 calories in two minutes. This is the single most useful trick for gaining.'
  },
  {
    t: 'Fuel the session properly',
    d: '60-80 g of carbs and 30 g of protein in the 90 minutes before you train, and another 80-100 g of carbs plus 40 g protein within an hour after. You are training six days a week now.'
  },
  {
    t: 'Half a pound a week, no faster',
    d: 'Past about a pound a week the extra is mostly fat, and you will spend three months dieting it off. Slow is the whole strategy — it is the difference between 200 lb lean and 205 lb soft.'
  },
  {
    t: 'The tape tells the truth, the scale does not',
    d: 'Weight going up only tells you the surplus works. Arm, chest and thigh climbing while the waist stays flat tells you it is working correctly. Measure every two weeks, cold.'
  },
  {
    t: 'Watch the Wednesday jump numbers',
    d: 'If your approach jump starts dropping and you are eating and sleeping enough, you are accumulating fatigue, not muscle. Take the deload seriously.'
  },
  {
    t: 'Sleep is where the muscle is built',
    d: 'Eight hours minimum, nine if you can. Chronic short sleep in a surplus shifts the ratio of what you gain toward fat, independent of your calories.'
  }
];

const SUPPLEMENTS = [
  { n: 'Creatine monohydrate', d: '5 g daily, timing irrelevant. Best-evidenced legal supplement there is, and it works even better in a surplus. Cheap. Take it.', tier: 'Worth it' },
  { n: 'Whey protein', d: 'Not magic — just the easiest way to hit 190 g a day while also eating 500 g of carbs.', tier: 'Worth it' },
  { n: 'Liquid carbs (maltodextrin or dextrose)', d: 'If you genuinely cannot eat enough, carbs you can drink around training are the least unpleasant way to close the gap.', tier: 'Situational' },
  { n: 'Vitamin D3 + K2', d: '2,000-4,000 IU if you train indoors. Low D is linked to worse muscle function and more injuries.', tier: 'Worth it' },
  { n: 'Caffeine', d: '3-6 mg/kg about 45 min pre-session. Real effect on output. Skip it before evening sessions or your sleep — and your gains — pay for it.', tier: 'Situational' },
  { n: 'Collagen + vitamin C', d: '15 g with 50 mg vitamin C about 45 min before jump sessions. Early but promising evidence for tendon health.', tier: 'Situational' },
  { n: 'Fat burners, BCAAs, testosterone boosters, mass gainers', d: 'BCAAs are pointless at your protein intake, the rest do not work, and "mass gainer" is sugar at four times the price of oats. Spend it on food.', tier: 'Skip' }
];

const MEAL_TEMPLATE = [
  {
    when: 'Breakfast', kcal: '~850',
    what: '4 whole eggs + 3 whites, 1.5 cups oats with berries and honey, glass of whole milk.',
    macro: '52 g protein / 105 g carb / 26 g fat'
  },
  {
    when: 'Mid-morning', kcal: '~450',
    what: 'Greek yogurt, granola, banana. Or the shake if you are short on time.',
    macro: '30 g protein / 60 g carb / 8 g fat'
  },
  {
    when: 'Pre-training', kcal: '~450',
    what: 'Rice cakes with honey, banana, whey shake.',
    macro: '30 g protein / 75 g carb / 4 g fat'
  },
  {
    when: 'Post-training', kcal: '~750',
    what: '8 oz chicken or lean beef, 2 cups white rice, veg, salt generously.',
    macro: '58 g protein / 100 g carb / 14 g fat'
  },
  {
    when: 'Dinner', kcal: '~850',
    what: '8 oz salmon or steak, large potato or pasta, big salad with olive oil.',
    macro: '52 g protein / 90 g carb / 30 g fat'
  },
  {
    when: 'Before bed', kcal: '~450',
    what: 'Cottage cheese or casein, peanut butter, handful of fruit.',
    macro: '42 g protein / 35 g carb / 16 g fat'
  }
];

/** The gaining-phase shake, because it is the difference between hitting the number and not. */
const SHAKE = {
  name: 'The 800-calorie shake',
  items: ['500 ml whole milk', '1 scoop whey', '80 g oats', '1 banana', '2 tbsp peanut butter', 'pinch of salt'],
  macro: '~55 g protein / 90 g carb / 28 g fat · about 800 kcal',
  note: 'Blend it, drink it between meals on days the food will not go down. Half a shake still counts.'
};

return { computeTargets, projectedWeight, weeksToGoal, surplusAdvice, GOALS, RULES, SUPPLEMENTS, MEAL_TEMPLATE, SHAKE };
});

/** Tiny DOM + chart helpers. No framework, no build step. */

const SVG_NS = 'http://www.w3.org/2000/svg';
const SVG_TAGS = new Set([
  'svg', 'circle', 'path', 'line', 'polyline', 'polygon', 'rect', 'text', 'g',
  'defs', 'linearGradient', 'stop', 'ellipse', 'tspan'
]);

function h(tag, attrs = {}, ...children) {
  // SVG elements must be namespaced or the browser treats them as inert
  // unknown HTML and nothing paints.
  const el = SVG_TAGS.has(tag)
    ? document.createElementNS(SVG_NS, tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

/* ---------------------------------------------------------------- TOASTS */
let toastHost;
function toast(msg, kind = 'ok', ms = 2600) {
  if (!toastHost) {
    toastHost = h('div', { class: 'toast-host' });
    document.body.append(toastHost);
  }
  const t = h('div', { class: `toast toast--${kind}`, text: msg });
  toastHost.append(t);
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => {
    t.classList.remove('in');
    setTimeout(() => t.remove(), 300);
  }, ms);
}

/* ----------------------------------------------------------------- SHEET */
function sheet(title, bodyNode, actions = []) {
  const back = h('div', { class: 'sheet-back' });
  const panel = h('div', { class: 'sheet' },
    h('div', { class: 'sheet-grip' }),
    h('div', { class: 'sheet-head' },
      h('h3', { text: title }),
      h('button', { class: 'icon-btn', 'aria-label': 'Close', onclick: close, html: '&times;' })
    ),
    h('div', { class: 'sheet-body' }, bodyNode),
    actions.length ? h('div', { class: 'sheet-actions' },
      actions.map(a => h('button', {
        class: `btn ${a.kind ? 'btn--' + a.kind : ''}`,
        onclick: () => { if (a.onClick?.() !== false) close(); }
      }, a.label))
    ) : null
  );
  back.append(panel);
  back.addEventListener('click', e => { if (e.target === back) close(); });
  document.body.append(back);
  requestAnimationFrame(() => back.classList.add('in'));

  function close() {
    back.classList.remove('in');
    setTimeout(() => back.remove(), 260);
  }
  return { close, panel };
}

function confirmSheet(title, message, onYes, yesLabel = 'Do it') {
  sheet(title, h('p', { class: 'muted', text: message }), [
    { label: 'Cancel' },
    { label: yesLabel, kind: 'danger', onClick: onYes }
  ]);
}

/* ------------------------------------------------------------ REST TIMER */
class RestTimer {
  constructor() {
    this.remaining = 0;
    this.total = 0;
    this.iv = null;
    this.el = null;
    this.onDone = null;
  }

  mount() {
    if (this.el) return;
    this.el = h('div', { class: 'rest-bar' },
      this.ring = h('svg', { class: 'rest-ring', viewBox: '0 0 40 40' }),
      h('div', { class: 'rest-meta' },
        this.label = h('div', { class: 'rest-time', text: '0:00' }),
        h('div', { class: 'rest-sub', text: 'Rest' })
      ),
      h('div', { class: 'rest-btns' },
        h('button', { class: 'chip', onclick: () => this.bump(-15), text: '-15' }),
        h('button', { class: 'chip', onclick: () => this.bump(15), text: '+15' }),
        h('button', { class: 'chip chip--solid', onclick: () => this.stop(), text: 'Skip' })
      )
    );
    this.ring.innerHTML =
      '<circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="4"/>' +
      '<circle class="rest-arc" cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="4" ' +
      'stroke-linecap="round" transform="rotate(-90 20 20)" stroke-dasharray="106.8" stroke-dashoffset="0"/>';
    this.arc = this.ring.querySelector('.rest-arc');
    document.body.append(this.el);
  }

  start(seconds, onDone) {
    if (!seconds) return;
    this.mount();
    this.total = seconds;
    this.remaining = seconds;
    this.onDone = onDone;
    this.el.classList.add('in');
    this.render();
    clearInterval(this.iv);
    this.iv = setInterval(() => {
      this.remaining--;
      this.render();
      if (this.remaining <= 0) this.ding();
    }, 1000);
  }

  bump(sec) {
    this.remaining = Math.max(0, this.remaining + sec);
    this.total = Math.max(this.total, this.remaining);
    this.render();
  }

  render() {
    if (!this.el) return;
    const m = Math.floor(Math.max(0, this.remaining) / 60);
    const s = Math.max(0, this.remaining) % 60;
    this.label.textContent = `${m}:${String(s).padStart(2, '0')}`;
    const frac = this.total ? Math.max(0, this.remaining) / this.total : 0;
    this.arc.setAttribute('stroke-dashoffset', String(106.8 * (1 - frac)));
    this.el.classList.toggle('rest-bar--low', this.remaining <= 10 && this.remaining > 0);
  }

  ding() {
    clearInterval(this.iv);
    this.iv = null;
    beep();
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    this.el.classList.add('rest-bar--done');
    this.label.textContent = 'GO';
    setTimeout(() => this.stop(), 2200);
    this.onDone?.();
  }

  stop() {
    clearInterval(this.iv);
    this.iv = null;
    this.remaining = 0;
    if (this.el) {
      this.el.classList.remove('in', 'rest-bar--done', 'rest-bar--low');
    }
  }
}

const restTimer = new RestTimer();

let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18, 0.36].forEach((offset, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = idx === 2 ? 1046 : 784;
      gain.gain.setValueAtTime(0, now + offset);
      gain.gain.linearRampToValueAtTime(0.28, now + offset + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.16);
    });
  } catch { /* audio blocked until first gesture — fine */ }
}

/* ---------------------------------------------------------------- CHARTS */

/**
 * Line chart as inline SVG. points: [{x:number, y:number, label?:string}]
 */
function lineChart(points, opts = {}) {
  const {
    w = 320, hgt = 140, pad = { t: 14, r: 12, b: 22, l: 34 },
    color = 'var(--accent)', fill = true, invert = false, target = null,
    yUnit = ''
  } = opts;

  if (!points.length) {
    return h('div', { class: 'chart-empty' }, 'No data yet — log it and this fills in.');
  }

  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if (target != null) { minY = Math.min(minY, target); maxY = Math.max(maxY, target); }
  const span = maxY - minY || Math.max(1, maxY * 0.1);
  minY -= span * 0.15; maxY += span * 0.15;
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const xSpan = maxX - minX || 1;

  const iw = w - pad.l - pad.r, ih = hgt - pad.t - pad.b;
  const X = v => pad.l + ((v - minX) / xSpan) * iw;
  const Y = v => pad.t + (1 - (v - minY) / (maxY - minY)) * ih;

  const path = points.map((p, idx) => `${idx ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${path}L${X(maxX).toFixed(1)},${(pad.t + ih).toFixed(1)}L${X(minX).toFixed(1)},${(pad.t + ih).toFixed(1)}Z`;

  const ticks = [minY + (maxY - minY) * 0.15, (minY + maxY) / 2, maxY - (maxY - minY) * 0.15];
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${hgt}`);
  svg.setAttribute('class', 'chart');
  svg.setAttribute('preserveAspectRatio', 'none');

  const parts = [];
  for (const t of ticks) {
    parts.push(`<line x1="${pad.l}" y1="${Y(t).toFixed(1)}" x2="${w - pad.r}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`);
    parts.push(`<text x="${pad.l - 6}" y="${(Y(t) + 3.5).toFixed(1)}" fill="rgba(255,255,255,.38)" font-size="9" text-anchor="end">${fmtNum(t)}</text>`);
  }
  if (target != null) {
    parts.push(`<line x1="${pad.l}" y1="${Y(target).toFixed(1)}" x2="${w - pad.r}" y2="${Y(target).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7"/>`);
    parts.push(`<text x="${w - pad.r}" y="${(Y(target) - 4).toFixed(1)}" fill="var(--good)" font-size="8.5" text-anchor="end">target ${fmtNum(target)}${yUnit}</text>`);
  }
  if (fill) {
    parts.push(`<defs><linearGradient id="g-${uid()}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".30"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`);
  }
  const gid = `grad${uid()}`;
  if (fill) {
    parts.push(`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".32"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient>`);
    parts.push(`<path d="${area}" fill="url(#${gid})"/>`);
  }
  parts.push(`<path d="${path}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`);
  for (const p of points) {
    parts.push(`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="var(--bg)" stroke="${color}" stroke-width="2"/>`);
  }
  // First and last value labels.
  const last = points[points.length - 1];
  parts.push(`<text x="${Math.min(w - pad.r, X(last.x) + 6).toFixed(1)}" y="${(Y(last.y) - 8).toFixed(1)}" fill="${color}" font-size="10.5" font-weight="700" text-anchor="end">${fmtNum(last.y)}${yUnit}</text>`);

  svg.innerHTML = parts.join('');
  return svg;
}

/** Small inline sparkline. */
function sparkline(values, color = 'currentColor', w = 72, hgt = 24) {
  if (values.length < 2) return h('span', { class: 'spark-empty', text: '—' });
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const pts = values.map((v, idx) => {
    const x = (idx / (values.length - 1)) * (w - 4) + 2;
    const y = hgt - 2 - ((v - min) / span) * (hgt - 4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${hgt}`);
  svg.setAttribute('class', 'spark');
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  return svg;
}

/** Horizontal bar set — used for weekly tonnage. */
function barChart(items, opts = {}) {
  const { color = 'var(--accent)' } = opts;
  if (!items.length) return h('div', { class: 'chart-empty' }, 'Nothing logged yet.');
  const max = Math.max(...items.map(it => it.v)) || 1;
  return h('div', { class: 'bars' },
    items.map(it => h('div', { class: 'bar-row' },
      h('span', { class: 'bar-label', text: it.label }),
      h('div', { class: 'bar-track' },
        h('div', { class: 'bar-fill', style: { width: `${(it.v / max) * 100}%`, background: color } })
      ),
      h('span', { class: 'bar-val', text: it.display ?? fmtNum(it.v) })
    ))
  );
}

function ring(pct, opts = {}) {
  const { size = 56, stroke = 5, color = 'var(--accent)', label } = opts;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('class', 'ringchart');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.innerHTML = `
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}"
      stroke-dashoffset="${(c * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    ${label ? `<text x="50%" y="50%" dy="3.5" text-anchor="middle" fill="var(--fg)" font-size="${size * 0.26}" font-weight="800">${label}</text>` : ''}`;
  return svg;
}

/* ----------------------------------------------------------------- UTILS */
let _uid = 0;
function uid() { return ++_uid; }

function fmtNum(n) {
  if (n == null) return '—';
  if (Math.abs(n) >= 10000) return `${(n / 1000).toFixed(0)}k`;
  if (Math.abs(n) >= 1000) return `${(n / 1000).toFixed(1)}k`;
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function numberInput(attrs = {}) {
  return h('input', {
    type: 'number', inputmode: 'decimal', step: 'any',
    class: 'num', ...attrs
  });
}

return { h, clear, toast, sheet, confirmSheet, beep, lineChart, sparkline, barChart, ring, fmtNum, fmtDate, numberInput, $, $$, restTimer };
});

__def('store', function () {
/**
 * All app state. Single object, persisted to localStorage, exported/importable
 * as JSON so nothing is ever trapped on one device.
 */

const { atWeek, blockForWeek, weekInBlock, TOTAL_WEEKS, weekSessions } = __req('program');
const { ex } = __req('exercises');

const KEY = 'atn.state.v1';
const SCHEMA = 1;

const DEFAULTS = () => ({
  v: SCHEMA,
  profile: {
    name: '',
    heightIn: 75,        // 6'3"
    weightLb: 190,
    age: 28,
    activity: 1.7,
    goal: 'leanGain',
    goalWeight: 200,
    startDate: todayISO()
  },
  maxes: {
    // Estimated 1RMs. Seeded conservatively; overwritten at the week-0 test.
    squat: 275, trapbar: 355, bench: 205, ohp: 125, clean: 155
  },
  cursor: { week: 1, day: null },
  logs: {},              // "week:day" -> session log
  metrics: {},           // metricKey -> [{d, v}]
  prefs: {
    plateInc: 5,
    autoRest: true,
    sound: true,
    theme: 'dark',
    cleanVariant: 'hang_clean'   // or 'jump_shrug'
  }
});

let state = null;
const listeners = new Set();

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ------------------------------------------------------------------- LOAD */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? migrate(JSON.parse(raw)) : DEFAULTS();
  } catch {
    state = DEFAULTS();
  }
  return state;
}

function migrate(s) {
  const base = DEFAULTS();
  return {
    ...base, ...s,
    profile: { ...base.profile, ...(s.profile || {}) },
    maxes: { ...base.maxes, ...(s.maxes || {}) },
    cursor: { ...base.cursor, ...(s.cursor || {}) },
    prefs: { ...base.prefs, ...(s.prefs || {}) },
    logs: s.logs || {},
    metrics: s.metrics || {}
  };
}

function get() {
  if (!state) load();
  return state;
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Could not persist state', e);
  }
  listeners.forEach(fn => fn(state));
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function update(mut) {
  mut(get());
  save();
}

function exportJSON() {
  return JSON.stringify(get(), null, 2);
}

function importJSON(text) {
  const parsed = JSON.parse(text);
  if (!parsed || typeof parsed !== 'object') throw new Error('Not a valid backup file');
  state = migrate(parsed);
  save();
}

function resetAll() {
  state = DEFAULTS();
  save();
}

/* -------------------------------------------------------------- LOAD MATH */

/** Epley. Good enough at low reps, which is all we use it for. */
function e1rm(weight, reps) {
  if (!weight || !reps) return 0;
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}

function roundPlate(w, inc = 5) {
  if (!w) return 0;
  return Math.max(inc, Math.round(w / inc) * inc);
}

/**
 * Working load for one prescription item at a given week-in-block.
 * Returns null when the movement is not percentage-driven.
 */
function targetLoad(item, wib) {
  const s = get();
  if (!item.pct) return null;
  const ref = refFor(item);
  if (!ref) return null;
  const max = s.maxes[ref];
  if (!max) return null;
  let pct = atWeek(item.pct, wib);
  if (item.pctOf) pct *= item.pctOf;
  return roundPlate(max * pct, s.prefs.plateInc);
}

function refFor(item) {
  // A prescription may name its own reference lift; otherwise the exercise
  // definition says which tested max it loads off.
  return item.ref || ex(item.ex).ref || null;
}

/** Warm-up ramp to a working weight. */
function warmupRamp(target, inc = 5) {
  if (!target || target < 95) return [];
  const steps = [
    { pct: 0.4, reps: 8 },
    { pct: 0.55, reps: 5 },
    { pct: 0.7, reps: 3 },
    { pct: 0.85, reps: 2 }
  ];
  return steps
    .map(st => ({ weight: roundPlate(target * st.pct, inc), reps: st.reps }))
    .filter(st => st.weight < target - inc);
}

/**
 * Percentage of 1RM you can move for a given number of reps at RPE 10,
 * i.e. taken to genuine failure. Standard reps-in-reserve chart.
 */
const RPE10_PCT = {
  1: 1.00, 2: 0.955, 3: 0.922, 4: 0.892, 5: 0.863, 6: 0.837,
  7: 0.811, 8: 0.786, 9: 0.762, 10: 0.74, 11: 0.72, 12: 0.70,
  13: 0.685, 14: 0.667, 15: 0.65, 16: 0.64, 17: 0.63, 18: 0.62, 20: 0.60
};

/** Each RPE point below failure costs roughly this much of your 1RM. */
const PER_RPE = 0.025;

function repsFromPrescription(reps) {
  if (typeof reps === 'number') return reps;
  const nums = String(reps ?? '').match(/\d+/g);
  if (!nums) return null;
  // "8-10" — aim at the top of the range, which is what the set should feel like.
  return Math.max(...nums.map(Number));
}

/**
 * Starting weight for an autoregulated lift with no logged history, derived
 * from the tested max via the RPE chart. Only possible for movements that
 * reference a max; a cable fly has no 1RM to work from.
 */
function rpeLoadEstimate(item, wib) {
  const s = get();
  const ref = refFor(item);
  if (!ref) return null;
  const max = s.maxes[ref];
  if (!max) return null;

  const reps = repsFromPrescription(atWeek(item.reps, wib));
  const rpe = atWeek(item.rpe, wib);
  if (!reps || !rpe) return null;

  const keys = Object.keys(RPE10_PCT).map(Number);
  const nearest = keys.reduce((a, b) => (Math.abs(b - reps) < Math.abs(a - reps) ? b : a));
  const pct = RPE10_PCT[nearest] - (10 - rpe) * PER_RPE;
  if (pct <= 0) return null;

  return { weight: roundPlate(max * pct, s.prefs.plateInc), pct, reps, rpe };
}

/* -------------------------------------------------------------- SESSION LOG */

function logKey(week, day) {
  return `${week}:${day}`;
}

function getLog(week, day) {
  return get().logs[logKey(week, day)] || null;
}

function ensureLog(week, day) {
  const s = get();
  const k = logKey(week, day);
  if (!s.logs[k]) s.logs[k] = { sets: {}, done: false, notes: '', started: null, date: null };
  return s.logs[k];
}

function setKeyFor(sessionId, exId, idx, setNo) {
  return `${sessionId}|${exId}|${idx}|${setNo}`;
}

function logSet(week, day, key, data) {
  update(s => {
    const log = s.logs[logKey(week, day)] || (s.logs[logKey(week, day)] = { sets: {}, done: false, notes: '', started: null, date: null });
    if (!log.started) log.started = new Date().toISOString();
    log.sets[key] = { ...(log.sets[key] || {}), ...data };
  });
}

function clearSet(week, day, key) {
  update(s => {
    const log = s.logs[logKey(week, day)];
    if (log) delete log.sets[key];
  });
}

function finishSession(week, day, notes) {
  update(s => {
    const log = s.logs[logKey(week, day)] || (s.logs[logKey(week, day)] = { sets: {}, done: false, notes: '', started: null, date: null });
    log.done = true;
    log.date = todayISO();
    log.finished = new Date().toISOString();
    if (notes != null) log.notes = notes;
  });
}

function reopenSession(week, day) {
  update(s => {
    const log = s.logs[logKey(week, day)];
    if (log) { log.done = false; log.finished = null; }
  });
}

/**
 * Last logged working weight for an exercise, searching backwards from the
 * current week. This is what drives suggestions on RPE-based lifts.
 */
function lastLoadFor(exId, beforeWeek, beforeDay) {
  const s = get();
  let best = null;
  for (const [k, log] of Object.entries(s.logs)) {
    const [w, d] = k.split(':').map(Number);
    if (w > beforeWeek || (w === beforeWeek && d >= beforeDay)) continue;
    for (const [sk, sv] of Object.entries(log.sets || {})) {
      const parts = sk.split('|');
      if (parts[1] !== exId) continue;
      if (!sv.done || !sv.w) continue;
      const stamp = w * 10 + d;
      if (!best || stamp > best.stamp || (stamp === best.stamp && sv.w > best.w)) {
        best = { w: sv.w, r: sv.r, rpe: sv.rpe, week: w, day: d, stamp };
      }
    }
  }
  return best;
}

/**
 * Suggested load for an autoregulated (RPE) lift: last session's top load,
 * nudged up when it was logged at or below the target effort.
 */
function suggestLoad(item, exId, week, day) {
  const s = get();
  const last = lastLoadFor(exId, week, day);
  if (!last) return null;
  const inc = s.prefs.plateInc;
  const targetRpe = Array.isArray(item.rpe) ? item.rpe[0] : item.rpe;
  let w = last.w;
  if (targetRpe && last.rpe && last.rpe <= targetRpe - 1) w = last.w + inc * 2;
  else if (targetRpe && last.rpe && last.rpe <= targetRpe) w = last.w + inc;
  else if (!last.rpe) w = last.w + inc;
  return { suggested: roundPlate(w, inc), last };
}

/** Look for logged 3RM-ish top sets that imply the stored max is stale. */
function staleMaxes() {
  const s = get();
  const out = [];
  const byRef = { squat: 'back_squat', trapbar: 'trap_dl', bench: 'bench', ohp: 'ohp', clean: 'hang_clean' };
  for (const [ref, exId] of Object.entries(byRef)) {
    let bestE = 0, at = null;
    for (const [k, log] of Object.entries(s.logs)) {
      for (const [sk, sv] of Object.entries(log.sets || {})) {
        if (sk.split('|')[1] !== exId) continue;
        if (!sv.done || !sv.w || !sv.r || sv.r > 6) continue;
        const est = e1rm(sv.w, sv.r);
        if (est > bestE) { bestE = est; at = k; }
      }
    }
    const cur = s.maxes[ref] || 0;
    if (bestE > cur * 1.025) out.push({ ref, current: cur, implied: roundPlate(bestE, s.prefs.plateInc), at });
  }
  return out;
}

function applyMax(ref, value) {
  update(s => { s.maxes[ref] = Math.round(value); });
}

/* ---------------------------------------------------------------- METRICS */

function logMetric(key, value, date) {
  update(s => {
    if (!s.metrics[key]) s.metrics[key] = [];
    const d = date || todayISO();
    const existing = s.metrics[key].find(p => p.d === d);
    if (existing) existing.v = value;
    else s.metrics[key].push({ d, v: value });
    s.metrics[key].sort((a, b) => a.d.localeCompare(b.d));
  });
}

function deleteMetric(key, date) {
  update(s => {
    if (s.metrics[key]) s.metrics[key] = s.metrics[key].filter(p => p.d !== date);
  });
}

function metricSeries(key) {
  return get().metrics[key] || [];
}

function latestMetric(key) {
  const arr = metricSeries(key);
  return arr.length ? arr[arr.length - 1] : null;
}

function firstMetric(key) {
  const arr = metricSeries(key);
  return arr.length ? arr[0] : null;
}

/** Rolling average of the last n entries — for bodyweight, which is noisy. */
function metricAvg(key, n = 7) {
  const arr = metricSeries(key).slice(-n);
  if (!arr.length) return null;
  return +(arr.reduce((a, p) => a + p.v, 0) / arr.length).toFixed(1);
}

 * Least-squares trend through recent bodyweight entries, in lb/week.
 *
 * Day-to-day bodyweight swings 3-4 lb on water alone, so a single pair of
 * weigh-ins says nothing. This needs a real span and several points before it
 * will commit to a number.

function weightTrend(days = 28) {
  const arr = metricSeries('bodyweight');
  if (arr.length < 3) return null;

  const cutoff = Date.now() - days * 86400000;

    .filter(p => Number.isFinite(p.t) && p.t >= cutoff);
  if (pts.length < 3) return null;

  const t0 = pts[0].t;
  const xs = pts.map(p => (p.t - t0) / 86400000);
  const ys = pts.map(p => p.v);
  const spanDays = xs[xs.length - 1];
  if (spanDays < 10) return null; // too short a window to mean anything

  const mx = xs.reduce((a, b) => a + b, 0) / xs.length;
  const my = ys.reduce((a, b) => a + b, 0) / ys.length;
  let num = 0, den = 0;
  for (let k = 0; k < xs.length; k++) {
    num += (xs[k] - mx) * (ys[k] - my);
    den += (xs[k] - mx) ** 2;
  }
  if (!den) return null;

  return {
    perWeek: +((num / den) * 7).toFixed(2),
    n: pts.length,

/* -------------------------------------------------------------- PROGRESS */

function weekProgress(week) {
  const sessions = weekSessions(week).filter(s => !s.optional);

  for (const s of sessions) {
    const log = getLog(week, s.day);

  }

/** Consecutive days with a completed session, counting back from today. */
function streak() {
  const s = get();
  const dates = new Set();
  for (const log of Object.values(s.logs)) if (log.done && log.date) dates.add(log.date);

}

  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/** Completed sessions in the last 28 days, as an adherence percentage. */
function adherence() {
  const s = get();
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 28);
  let done = 0;
  for (const log of Object.values(s.logs)) {
    if (log.done && log.date && new Date(log.date) >= cutoff) done++;
  }
  return { done, expected: 20, pct: Math.min(100, Math.round((done / 20) * 100)) };
}

/** Total tonnage logged, all time. */
function totalTonnage() {
  let t = 0;
  for (const log of Object.values(get().logs)) {
    for (const sv of Object.values(log.sets || {})) {
      if (sv.done && sv.w && sv.r) t += sv.w * sv.r;
    }
  }
  return t;
}

function tonnageByWeek() {
  const out = {};
  for (const [k, log] of Object.entries(get().logs)) {
    const w = Number(k.split(':')[0]);
    let t = 0;
    for (const sv of Object.values(log.sets || {})) {

    }
    out[w] = (out[w] || 0) + t;
  }
  return out;
}

/** Best estimated 1RM per lift over time, for the strength chart. */
function e1rmSeries(exId) {
  const points = [];
  for (const [k, log] of Object.entries(get().logs)) {
    const w = Number(k.split(':')[0]);
    let best = 0;
    for (const [sk, sv] of Object.entries(log.sets || {})) {
      if (sk.split('|')[1] !== exId) continue;
      if (!sv.done || !sv.w || !sv.r || sv.r > 8) continue;
      best = Math.max(best, e1rm(sv.w, sv.r));
    }
    if (best) points.push({ week: w, v: best, d: log.date });
  }

/* ---------------------------------------------------------------- CURSOR */

function currentWeek() {
  return Math.min(TOTAL_WEEKS, Math.max(1, get().cursor.week || 1));
}

function setWeek(w) {
  update(s => { s.cursor.week = Math.min(TOTAL_WEEKS, Math.max(1, w)); });
}

/** Today's day index (0 = Mon .. 6 = Sun). */
function todayDayIndex() {
  return (new Date().getDay() + 6) % 7;
}

/**
 * The session the app should open on: today's if it exists and is unfinished,
 * otherwise the next unfinished one this week, otherwise today's.
 */
function suggestedDay() {
  const week = currentWeek();
  const today = todayDayIndex();
  const sessions = weekSessions(week);
  const todaySession = sessions.find(s => s.day === today);
  if (todaySession && !getLog(week, today)?.done) return today;
  const next = sessions.find(s => s.day > today && !s.optional && !getLog(week, s.day)?.done);
  if (next) return next.day;
  const anyLeft = sessions.find(s => !s.optional && !getLog(week, s.day)?.done);
  if (anyLeft) return anyLeft.day;
  return todaySession ? today : sessions[0].day;
}

  const w = currentWeek();
  const p = weekProgress(w);
  if (p.total && p.done >= p.total && w < TOTAL_WEEKS) {
    setWeek(w + 1);
    return true;
  }
  return false;

  return { block: blockForWeek(w), wib: weekInBlock(w), week: w };
}

  const body = h('div', { class: 'detail' },
    h('p', { class: 'detail-why', text: def.why }),
    h('h4', { text: 'How to do it' }),
    h('ol', { class: 'cues' }, def.cues.map(c => h('li', { text: c }))),
    item.tempo ? h('p', { class: 'detail-tempo' },
      h('strong', { text: `Tempo ${item.tempo}: ` }),
      `${item.tempo.split('-')[0]} s lowering, ${item.tempo.split('-')[1]} s pause at the bottom, ${item.tempo.split('-')[2]} s driving up.`
    ) : null,
    item.rest ? h('p', { class: 'muted', text: `Rest ${item.rest} seconds between sets.` }) : null,
    historyFor(item.ex)
  );
  sheet(def.name, body, [{ label: 'Got it', kind: 'primary' }]);
}

function historyFor(exId) {
  const s = store.get();
  const rows = [];
  for (const [k, log] of Object.entries(s.logs)) {
    const [w, d] = k.split(':').map(Number);
    const hits = Object.entries(log.sets || {})
      .filter(([sk, sv]) => sk.split('|')[1] === exId && sv.done && sv.w);
    if (!hits.length) continue;
    const top = hits.reduce((a, b) => (b[1].w > a[1].w ? b : a));
    rows.push({ w, d, weight: top[1].w, reps: top[1].r, date: log.date });
  }
  rows.sort((a, b) => b.w - a.w || b.d - a.d);
  if (!rows.length) return h('p', { class: 'muted', text: 'No history for this movement yet.' });
  return h('div', { class: 'hist' },
    h('h4', { text: 'Your history (top set)' }),
    rows.slice(0, 8).map(r => h('div', { class: 'hist-row' },
      h('span', { class: 'hist-wk', text: `Wk ${r.w} ${dayLabel(r.d)}` }),
      h('span', { class: 'hist-load', text: `${r.weight} lb × ${r.reps || '?'}` }),
      r.reps ? h('span', { class: 'hist-e1', text: `e1RM ${store.e1rm(r.weight, r.reps)}` }) : null
    ))
  );
}

/* ------------------------------------------------------ metric capture */
function metricCapture(metricKey, root, nav) {
  const m = METRICS[metricKey];
  if (!m) return null;
  const latest = store.latestMetric(metricKey);
  const input = numberInput({
    placeholder: latest ? String(latest.v) : m.unit,
    class: 'num num--wide'
  });
  return h('div', { class: 'capture' },
    h('span', { class: 'capture-label', text: `Log ${m.name} (${m.unit})` }),
    input,
    h('button', {
      class: 'btn btn--sm btn--primary',
      onclick: () => {
        const v = num(input.value);
        if (v == null) { toast('Enter a number first', 'warn'); return; }
        store.logMetric(metricKey, v);
        toast(`${m.name}: ${v} ${m.unit} logged`);
        input.value = '';
      }
    }, 'Save')
  );
}

function maxCapture(ref, root, nav) {
  const m = MAX_LIFTS[ref];
  if (!m) return null;
  const cur = store.get().maxes[ref];
  const input = numberInput({ placeholder: '3RM weight', class: 'num num--wide' });
  return h('div', { class: 'capture' },
    h('span', { class: 'capture-label', text: `${m.name} 3RM → est. 1RM (now ${cur})` }),
    input,
    h('button', {
      class: 'btn btn--sm btn--primary',
      onclick: () => {
        const v = num(input.value);
        if (v == null) { toast('Enter the weight you hit for 3', 'warn'); return; }
        const est = store.e1rm(v, 3);
        store.applyMax(ref, est);
        toast(`${m.name} max set to ${est} lb. Every percentage just updated.`);
        input.value = '';
        if (root && nav) nav('today');
      }
    }, 'Set max')
  );
}

/* ---------------------------------------------------------------- finish */
function finish(week, day, root, nav) {
  store.finishSession(week, day);
  restTimer.stop();

  const stale = store.staleMaxes();
  const advanced = store.maybeAdvanceWeek();

  if (stale.length) {
    const body = h('div', null,
      h('p', { class: 'muted', text: 'Your logged sets imply you are stronger than the maxes driving your percentages. Update them so the loads keep up?' }),
      h('div', { class: 'stack-sm' },
        stale.map(st => h('div', { class: 'stalerow' },
          h('span', { text: MAX_LIFTS[st.ref]?.name || st.ref }),
          h('span', { class: 'stale-nums', text: `${st.current} → ${st.implied} lb` })
        ))
      )
    );
    sheet('Nice — time to level up', body, [
      { label: 'Not yet' },
      {
        label: 'Update maxes', kind: 'primary',
        onClick: () => {
          stale.forEach(st => store.applyMax(st.ref, st.implied));
          toast('Maxes updated. Loads recalculated.');
          nav('today');
        }
      }
    ]);
  } else {
    toast(advanced ? `Week ${week} complete. Week ${week + 1} unlocked.` : 'Session logged. Go eat.', 'ok');
  }

  if (advanced) setTarget(store.currentWeek(), null);
  render(root, nav);
}

function num(v) {
  if (v === '' || v == null) return null;
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : null;
}

return { setTarget, render };
});

              h('span', { class: 'muted', text: series.length ? `${series.length} entries · latest ${series[series.length - 1].v} ${m.unit}` : 'no entries' })
            ),

  );

  body.append(h('div', { class: 'spacer' }));

/* ----------------------------------------------------------------- pieces */

function bodyweightHero(profile, t) {

    return h('div', { class: 'card card--hero' },

      toGo != null && toGo <= 0 ? kv('Target', 'reached') : null
    ),
    lineChart(bw.map((p, idx) => ({ x: idx, y: p.v })), { hgt: 130, target: goalW, yUnit: ' lb' }),
    h('p', { class: `advice-line advice-line--sm tone-${advice.tone}`, text: advice.headline })
  );
}

function stat(cap, val, sub) {
  return h('div', { class: 'stat' },
    h('span', { class: 'stat-cap', text: cap }),
    h('span', { class: 'stat-val', text: val }),
    h('span', { class: 'stat-sub', text: sub })
  );
}

function kv(k, v) {
  if (!v) return null;
  return h('div', { class: 'kv' },
    h('span', { class: 'kv-k', text: k }),
    h('span', { class: 'kv-v', text: v })
  );
}

function metricTile(key, root, nav) {
  const m = METRICS[key];
  const series = store.metricSeries(key);
  const last = series.length ? series[series.length - 1] : null;
  const firstV = series.length ? series[0].v : null;

  let deltaGood = null, deltaText = null;
  if (series.length > 1) {
    const raw = last.v - firstV;
    deltaText = `${raw >= 0 ? '+' : ''}${raw.toFixed(1)}`;
    if (m.better === 'higher') deltaGood = raw >= 0;
    else if (m.better === 'lower') deltaGood = raw <= 0;
    else deltaGood = Math.abs(raw) < 0.75; // "flat" — small change is the win
  }

  return h('button', {
    class: 'mtile',
    onclick: () => openMetricSheet(key, m, root, nav)
  },
    h('span', { class: 'mtile-cap', text: m.name }),
    h('span', { class: 'mtile-val' },
      last ? `${last.v}` : '—',
      h('span', { class: 'mtile-unit', text: m.unit })
    ),
    series.length > 1
      ? sparkline(series.map(p => p.v), 'currentColor', 64, 20)
      : h('span', { class: 'spark-empty', text: 'tap to log' }),
    deltaText ? h('span', {
      class: `mtile-delta ${deltaGood ? 'up' : 'down'}`,
      text: deltaText
    }) : null
  );
}

function logCard(root, nav) {
  const keys = Object.keys(METRICS);
  const sel = h('select', { class: 'sel' }, keys.map(k => h('option', { value: k, text: `${METRICS[k].name} (${METRICS[k].unit})` })));
  const val = numberInput({ placeholder: 'value', class: 'num num--wide' });
  const dateIn = h('input', { type: 'date', class: 'num num--date', value: store.todayISO() });

  return h('div', { class: 'card card--log' },
    h('h2', { class: 'sect-title', text: 'Log a measurement' }),
    h('div', { class: 'logrow' }, sel, val, dateIn,
      h('button', {
        class: 'btn btn--primary',
        onclick: () => {
          const v = parseFloat(val.value);
          if (!Number.isFinite(v)) { toast('Enter a number', 'warn'); return; }
          store.logMetric(sel.value, v, dateIn.value || undefined);
          if (sel.value === 'bodyweight') store.update(s => { s.profile.weightLb = v; });
          toast(`${METRICS[sel.value].name} logged`);
          render(root, nav);
        }
      }, 'Log')
    ),
    h('p', { class: 'muted', text: 'Weigh in at least three times a week — the app needs several points across at least ten days before it will trust a trend. Approach and block jump are touch height minus your standing reach.' })
  );
}

function openMetricSheet(key, m, root, nav) {
  const series = store.metricSeries(key);
  const body = h('div', { class: 'detail' },
    m.note ? h('p', { class: 'muted', text: m.note }) : null,
    series.length
      ? lineChart(series.map((p, idx) => ({ x: idx, y: p.v })), {
          hgt: 140, target: m.target ?? null, yUnit: ` ${m.unit}`
        })
      : h('p', { class: 'muted', text: 'Nothing logged for this yet.' }),
    series.length ? h('div', { class: 'hist' },
      h('h4', { text: 'Entries' }),
      [...series].reverse().map(p => h('div', { class: 'hist-row' },
        h('span', { class: 'hist-wk', text: fmtDate(p.d) }),
        h('span', { class: 'hist-load', text: `${p.v} ${m.unit}` }),
        h('button', {
          class: 'linkbtn',
          onclick: () => { store.deleteMetric(key, p.d); toast('Deleted'); render(root, nav); }
        }, 'delete')
      ))
    ) : null
  );
  sheet(m.name, body, [{ label: 'Close', kind: 'primary' }]);
}

return { render };

  const goal = h('select', { class: 'sel' },
    Object.entries(GOALS).map(([k, g]) => h('option', {
      value: k, text: `${g.name} (${g.rate > 0 ? '+' : ''}${g.rate} lb/wk)`, selected: p.goal === k

  );
  const act = h('select', { class: 'sel' },
    [
      { v: 1.55, l: 'Lifting only, mostly desk-bound' },
      { v: 1.7, l: 'Lifting 5–6× + volleyball 2–3× (default)' },
      { v: 1.85, l: 'Lifting 5–6× + volleyball 4–5×' },
      { v: 2.0, l: 'Two-a-days / tournament weeks' }
    ].map(o => h('option', { value: o.v, text: o.l, selected: Math.abs(o.v - p.activity) < 0.01 }))
  );

    h('p', { class: 'muted', text: Object.values(GOALS).map(g => `${g.name}: ${g.blurb}`).join('\n') }),
    field('Bodyweight (lb)', wt),
    field('Target weight (lb)', gw),
    field('Height (in)', ht),
    field('Age', age),
    field('Activity level', act)
  ), [
    { label: 'Cancel' },
    {
      label: 'Save', kind: 'primary',
      onClick: () => {
        store.update(s => {
          s.profile.weightLb = parseFloat(wt.value) || s.profile.weightLb;
          s.profile.goalWeight = parseFloat(gw.value) || s.profile.goalWeight;
          s.profile.heightIn = parseFloat(ht.value) || s.profile.heightIn;

          s.profile.goal = goal.value;
        });
        toast('Targets recalculated');
        render(root, nav);
      }
    }
  ]);
}

    h('span', { class: 'field-label', text: label }),
    input
  );
}

return { render };
});

  prep: 'Movement Prep', recovery: 'Recovery', test: 'Testing'

function field(label, input) {

    input
  );
}

function toggle(label, value, onChange) {
  const input = h('input', {
    type: 'checkbox', class: 'sw-in', checked: value,
    onchange: e => onChange(e.target.checked)
  });
  return h('label', { class: 'swrow' },
    h('span', { class: 'maxrow-name', text: label }),
    h('span', { class: 'sw' }, input, h('span', { class: 'sw-track' }))
  );
}

function doExport() {
  const data = store.exportJSON();
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const name = `above-the-net-backup-${store.todayISO()}.json`;

  // Try the share sheet first — on iOS that is the only reliable save path.
  if (navigator.canShare?.({ files: [new File([blob], name, { type: 'application/json' })] })) {
    navigator.share({
      files: [new File([blob], name, { type: 'application/json' })],
      title: 'Above the Net backup'
    }).catch(() => fallbackDownload(url, name));
  } else {
    fallbackDownload(url, name);
  }
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function fallbackDownload(url, name) {
  const a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  toast('Backup saved');
}

function doImport(root, nav) {
  const input = h('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' } });
  input.addEventListener('change', () => {
    const file = input.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        store.importJSON(String(reader.result));
        toast('Backup restored');
        nav('today');
      } catch (e) {
        toast('That file did not look like a backup', 'warn');
      }
    };
    reader.readAsText(file);
  });
  document.body.append(input);
  input.click();
  setTimeout(() => input.remove(), 1000);
}

return { render };
